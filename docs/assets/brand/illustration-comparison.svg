<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none">
  <!-- Traditional USB Method (Left Panel) -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="365" height="200" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="14" y="14" width="130" height="22" rx="4" fill="#21262d"/>
    <text x="22" y="29" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#8b949e">TRADITIONAL WORKFLOW</text>
    <text x="14" y="58" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">External USB Flash Drive</text>

    <!-- Visual of USB + Host Drive -->
    <g transform="translate(14, 72)">
      <!-- External Flash Drive Graphic -->
      <rect x="0" y="8" width="60" height="32" rx="4" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
      <rect x="60" y="14" width="16" height="20" rx="2" fill="#30363d"/>
      <text x="8" y="28" font-family="ui-monospace, monospace" font-size="9" fill="#f85149">USB Flash</text>

      <!-- Arrow -->
      <path d="M90 24H125M120 18L126 24L120 30" stroke="#8b949e" stroke-width="1.5"/>

      <!-- Target PC Drive -->
      <rect x="140" y="4" width="180" height="40" rx="4" fill="#0d1117" stroke="#30363d"/>
      <text x="160" y="28" font-family="ui-monospace, monospace" font-size="10" fill="#8b949e">Target Internal NVMe / SSD</text>
    </g>

    <path d="M14 135H351" stroke="#21262d"/>
    <g transform="translate(14, 145)">
      <circle cx="6" cy="10" r="3" fill="#f85149"/>
      <text x="18" y="14" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Requires separate, blank physical USB flash drive</text>
      <circle cx="6" cy="30" r="3" fill="#f85149"/>
      <text x="18" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Manual flashing tool, BIOS boot-order intervention</text>
    </g>
  </g>

  <!-- ULLI-Next Internal Method (Right Panel) -->
  <g transform="translate(415, 20)">
    <rect x="0" y="0" width="365" height="200" rx="10" fill="#161b22" stroke="#10b981" stroke-width="1.5"/>
    <rect x="14" y="14" width="125" height="22" rx="4" fill="#042f2e" stroke="#10b981" stroke-width="0.8"/>
    <text x="22" y="29" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#34d399">ULLI-NEXT PIPELINE</text>
    <text x="14" y="58" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">Internal Storage Staging</text>

    <!-- Visual of Internal Drive Layout -->
    <g transform="translate(14, 72)">
      <rect x="0" y="4" width="337" height="40" rx="4" fill="#0d1117" stroke="#30363d"/>
      <!-- Host Partition -->
      <rect x="4" y="8" width="130" height="32" rx="2" fill="#21262d"/>
      <text x="25" y="28" font-family="ui-monospace, monospace" font-size="10" fill="#c9d1d9">Host Partition</text>
      <!-- Staging Partition -->
      <rect x="138" y="8" width="95" height="32" rx="2" fill="#10b981"/>
      <text x="148" y="28" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#042f2e">7GB Staging</text>
      <!-- Target Space -->
      <rect x="237" y="8" width="95" height="32" rx="2" fill="#042f2e" stroke="#10b981" stroke-width="1"/>
      <text x="247" y="28" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">Unallocated</text>
    </g>

    <path d="M14 135H351" stroke="#21262d"/>
    <g transform="translate(14, 145)">
      <circle cx="6" cy="10" r="3" fill="#10b981"/>
      <text x="18" y="14" font-family="system-ui, sans-serif" font-size="12" fill="#f0f6fc">Zero external media; downloads directly to host</text>
      <circle cx="6" cy="30" r="3" fill="#10b981"/>
      <text x="18" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#f0f6fc">Direct UEFI entry: reboot cleanly into live desktop</text>
    </g>
  </g>
</svg>
