<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Upward Boot Arrow (Live OS Execution from Staging) -->
  <path d="M24 5L35 18H28V23H20V18H13L24 5Z" fill="#10b981"/>
  <path d="M24 9L30 16H26V21H22V16H18L24 9Z" fill="#34d399"/>

  <!-- Upper Storage Slab (Live Staging + Unallocated Space) -->
  <rect x="6" y="25" width="36" height="8" rx="2" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <!-- FAT32 Staging Partition Segment -->
  <rect x="8.5" y="27.5" width="11" height="3" rx="1" fill="#10b981"/>
  <!-- Target Unallocated Segment -->
  <rect x="21.5" y="27.5" width="16" height="3" rx="1" fill="#30363d"/>
  <!-- Status LED -->
  <circle cx="40" cy="29" r="1" fill="#34d399"/>

  <!-- Lower Storage Slab (Host Drive Geometry) -->
  <rect x="6" y="35" width="36" height="8" rx="2" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <!-- Host OS Partition Segment -->
  <rect x="8.5" y="37.5" width="18" height="3" rx="1" fill="#485360"/>
  <!-- ESP Partition Segment -->
  <rect x="28.5" y="37.5" width="6" height="3" rx="1" fill="#30363d"/>
  <circle cx="40" cy="39" r="1" fill="#485360"/>
</svg>
